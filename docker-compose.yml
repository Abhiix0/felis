version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: felis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: felis
      POSTGRES_USER: felis
      POSTGRES_PASSWORD: felis_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felis -d felis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
