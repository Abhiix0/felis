name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  mobile-checks:
    name: Mobile TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json
      - run: |
          if [ -d "apps/mobile" ]; then
            cd apps/mobile && npm ci && npx tsc --noEmit
          elif [ -d "expo-app" ]; then
            cd expo-app && npm ci && npx tsc --noEmit
          fi

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: felis_test
          POSTGRES_USER: felis
          POSTGRES_PASSWORD: felis_dev
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cd backend && pip install -r requirements.txt -r requirements-dev.txt
      - run: cd backend && pytest tests/ -v
        env:
          DATABASE_URL: postgresql://felis:felis_dev@localhost:5432/felis_test

  desktop-build:
    name: Desktop TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd apps/desktop && npm install && npm run typecheck
