name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  monorepo-checks:
    name: Monorepo Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Typecheck all workspaces
        run: npm run typecheck --if-present
      - name: Test all workspaces
        run: npm test --workspaces --if-present
      - name: Build Desktop App
        run: npm run build --workspace=@felis/desktop

  backend-tests:
    name: Backend Migrations & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: felis_test
          POSTGRES_USER: felis
          POSTGRES_PASSWORD: felis_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run Alembic Migrations
        run: |
          cd backend
          alembic upgrade head
        env:
          DATABASE_URL: postgresql://felis:felis_dev@localhost:5432/felis_test
      - name: Run Pytest Suite
        run: |
          cd backend
          pytest tests/ -v
        env:
          DATABASE_URL: postgresql://felis:felis_dev@localhost:5432/felis_test
